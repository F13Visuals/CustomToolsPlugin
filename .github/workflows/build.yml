name: Build Plugin

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
            - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: CustomToolsPlugin
          path: build/libs/*.jar
